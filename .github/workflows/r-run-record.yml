name: R run record

# r/recordStrategusRun.R and src/lib/strategus/runRecord.ts must hash the same way: if they drift,
# no regulatory StudyPack can be sealed. This runs the R tests and checks a record written by R
# with the TypeScript implementation.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  r-run-record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - run: Rscript -e 'install.packages("jsonlite")'
      - run: Rscript r/tests/test-recordStrategusRun.R
      - run: Rscript r/tests/cross-check.R "$RUNNER_TEMP/r-run-record"
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/strategus/runRecord.r.test.ts
        env:
          STUDYSTUDIO_R_RECORD: ${{ runner.temp }}/r-run-record
