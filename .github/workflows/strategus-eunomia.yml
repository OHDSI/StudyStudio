name: Strategus on Eunomia

# Runs a real Strategus study (CohortGeneratorModule + CohortMethodModule on Eunomia GiBleed) through
# recordStrategusRun(), twice (full run, then skipCompletedTasks), and checks the run record with the
# TypeScript implementation. The results are then sealed as a site StudyPack and exported as in the
# Export Hub: define.xml (v2.1 and v2.0, checked against the CDISC schemas), Dataset-JSON, the audit
# report and the draft reviewer's guide, uploaded for review. Started by hand, e.g. after a new
# Strategus release.
on:
  workflow_dispatch:
    inputs:
      strategus-ref:
        description: Strategus git ref (tag or branch)
        default: v1.6.0

permissions:
  contents: read

env:
  SCHEMAS_REPO: cdisc-org/data-definition-engine
  SCHEMAS_SHA: 993c4880cccb7a62d207f187c198f7c6cd9f4291

jobs:
  eunomia:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Folders
        run: |
          echo "EUNOMIA_DATA_FOLDER=$RUNNER_TEMP/eunomia-data" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/eunomia-run" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2
        with:
          r-version: release
          use-public-rspm: true
      - name: Configure Java for rJava (SqlRender)
        run: sudo R CMD javareconf
      - name: Install HADES packages
        run: |
          Rscript -e 'install.packages(c("remotes", "jsonlite", "RSQLite", "Eunomia", "CirceR", "CohortGenerator", "CohortMethod", "Cyclops", "FeatureExtraction", "DatabaseConnector", "SqlRender", "ParallelLogger", "ResultModelManager", "R6", "checkmate", "cli", "digest", "dplyr", "purrr", "rlang"))'
          Rscript -e 'remotes::install_github("OHDSI/Strategus", ref = "${{ inputs.strategus-ref }}", upgrade = "never", dependencies = FALSE)'
          Rscript -e 'for (p in c("Strategus", "CohortMethod", "Eunomia")) cat(p, as.character(packageVersion(p)), "\n")'
      - name: Run the study twice with recordStrategusRun()
        id: study
        run: |
          mkdir -p "$EUNOMIA_DATA_FOLDER"
          Rscript r/tests/eunomia/run-eunomia.R "$OUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Check the run record with the TypeScript implementation
        run: npx vitest run src/lib/strategus/runRecord.eunomia.test.ts
        env:
          STUDYSTUDIO_EUNOMIA: ${{ env.OUT }}
      - name: Install xmllint
        if: ${{ !cancelled() && steps.study.outcome == 'success' }}
        run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - name: Fetch the CDISC schemas
        if: ${{ !cancelled() && steps.study.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/cdisc"
          curl -fsSL "https://codeload.github.com/$SCHEMAS_REPO/tar.gz/$SCHEMAS_SHA" \
            | tar xz -C "$RUNNER_TEMP/cdisc" --strip-components=1 --wildcards '*/schemas/define/*' '*/schemas/odm/1.3.2/*'
          echo "STUDYSTUDIO_DEFINE_XSD=$RUNNER_TEMP/cdisc/schemas" >> "$GITHUB_ENV"
      - name: Export define.xml, Dataset-JSON and the reviewer's guide, and check them
        if: ${{ !cancelled() && steps.study.outcome == 'success' }}
        run: npx vitest run src/lib/export/regulatory.eunomia.test.ts
        env:
          STUDYSTUDIO_EUNOMIA: ${{ env.OUT }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: eunomia-run
          path: |
            ${{ env.OUT }}/diagnostics.json
            ${{ env.OUT }}/results/run_record.json
            ${{ env.OUT }}/results/executionSettings.json
            ${{ env.OUT }}/results/strategus-log.txt
            ${{ env.OUT }}/study/ExecuteAnalyses.R
            ${{ env.OUT }}/study/renv.lock
            ${{ env.OUT }}/submission/
          if-no-files-found: warn
